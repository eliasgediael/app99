name: App99

options:
  bundleIdPrefix: com.elias
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Linguagem Swift 5 (o compilador aceita 4, 4.2, 5 ou 6 aqui; o código usa recursos do Swift 5.9)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  App99:
    type: application
    platform: iOS
    sources:
      - App99
      - Shared
    info:
      path: App99/Info.plist
      properties:
        CFBundleDisplayName: Apex
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Pasta de dados visível no app Arquivos e no iTunes (backup e análise dos turnos)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # audio: o atalho "Analisar corrida 99" fala com o app em segundo plano
        # location: GPS do turno continua com o app fechado (só durante o turno)
        UIBackgroundModes:
          - audio
          - location
        NSLocationWhenInUseUsageDescription: 'Durante o turno, o Apex usa sua localização para medir os km rodados, o tempo parado e onde as corridas começam e terminam. Só enquanto o turno estiver ativo; os dados ficam só no seu iPhone.'
        NSLocationAlwaysAndWhenInUseUsageDescription: 'Durante o turno, o Apex usa sua localização para medir os km rodados, o tempo parado e onde as corridas começam e terminam. Só enquanto o turno estiver ativo; os dados ficam só no seu iPhone.'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elias.app99
        PRODUCT_NAME: App99
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Broadcast
        embed: true
      - sdk: ReplayKit.framework
    scheme: {}

  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Apex
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elias.app99.broadcast
        PRODUCT_NAME: Broadcast
    dependencies:
      - sdk: ReplayKit.framework
