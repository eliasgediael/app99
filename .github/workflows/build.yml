name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Duas versões: Xcode mais recente e Xcode 16 (teste pra extensão que morre
    # com CODESIGNING "Invalid Page" depois de reassinada pelo Sideloadly no iOS 26)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            xcode: latest-stable
            artifact: App99-ipa
          - runner: macos-15
            xcode: '16.4'
            artifact: App99-ipa-xcode16
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar (Release, iphoneos, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project App99.xcodeproj \
            -scheme App99 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Montar App99.ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/App99.app
          test -d "$APP/PlugIns/Broadcast.appex" || { echo "Extensão não foi embutida"; exit 1; }
          # Assinatura ad-hoc (de dentro pra fora) só pra deixar uma assinatura válida e completa
          # que o Sideloadly substitui; sem isso a extensão morria com CODESIGNING "Invalid Page".
          codesign --force --sign - --timestamp=none "$APP/PlugIns/Broadcast.appex"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry App99.ipa Payload

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: App99.ipa
          if-no-files-found: error
